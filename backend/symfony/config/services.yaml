# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Study\Domain\Repository\StudyRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineStudyRepository

    App\Study\Domain\Repository\CategoryRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineCategoryRepository

    App\Study\Domain\Repository\TagRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineTagRepository

    # --- Shared: LDAP ---
    App\Shared\Infrastructure\Ldap\LdapConnectionService:
        arguments:
            $ldapHost: '%env(LDAP_HOST)%'
            $ldapPort: '%env(int:LDAP_PORT)%'
            $bindDn: '%env(LDAP_BIND_DN)%'
            $bindPassword: '%env(LDAP_BIND_PASSWORD)%'
            $baseDn: '%env(LDAP_BASE_DN)%'

    # --- Identity: Repository bindings ---
    App\Identity\Infrastructure\Dbal\IdentityOutboxRepository:
        arguments:
            $connection: '@doctrine.dbal.identity_connection'

    App\Identity\Domain\Repository\OutboxRepositoryInterface: '@App\Identity\Infrastructure\Dbal\IdentityOutboxRepository'

    # --- Acciones: Repository bindings ---
    App\Acciones\Domain\Repository\AccionRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionRepository

    App\Acciones\Domain\Repository\AccionPrecioRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionPrecioRepository

    App\Acciones\Domain\Repository\PortafolioRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrinePortafolioRepository

    App\Acciones\Domain\Repository\PortafolioAccionRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrinePortafolioAccionRepository

    App\Acciones\Domain\Repository\AccionNoticiaRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionNoticiaRepository

    App\Acciones\Domain\Repository\AccionEarningsRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionEarningsRepository

    App\Acciones\Domain\Repository\AccionEarningsReportRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionEarningsReportRepository

    App\Acciones\Domain\Repository\AccionAnalisisRepositoryInterface:
        class: App\Acciones\Infrastructure\Doctrine\Repository\DoctrineAccionAnalisisRepository

    # --- Futbol: Repository bindings ---
    App\Futbol\Domain\Repository\FutbolLigaRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolLigaRepository

    App\Futbol\Domain\Repository\FutbolPartidoRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolPartidoRepository

    App\Futbol\Domain\Repository\FutbolSeleccionDiariaRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolSeleccionDiariaRepository

    App\Futbol\Domain\Repository\FutbolAnalisisRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolAnalisisRepository

    App\Futbol\Domain\Repository\FutbolLigaGpmRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolLigaGpmRepository

    App\Futbol\Domain\Repository\FutbolFavoritoRepositoryInterface:
        class: App\Futbol\Infrastructure\Doctrine\Repository\DoctrineFutbolFavoritoRepository

    # --- ActiveDirectory: Repository bindings ---
    App\ActiveDirectory\Domain\Repository\OrganizationRepositoryInterface:
        class: App\ActiveDirectory\Infrastructure\Ldap\AdOrganizationRepository

    App\ActiveDirectory\Domain\Repository\UserRepositoryInterface:
        class: App\ActiveDirectory\Infrastructure\Ldap\AdUserRepository
