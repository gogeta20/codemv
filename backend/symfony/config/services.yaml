# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Study\Domain\Repository\StudyRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineStudyRepository

    App\Study\Domain\Repository\CategoryRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineCategoryRepository

    App\Study\Domain\Repository\TagRepositoryInterface:
        class: App\Study\Infrastructure\Doctrine\Repository\DoctrineTagRepository

    # --- Shared: LDAP ---
    App\Shared\Infrastructure\Ldap\LdapConnectionService:
        arguments:
            $ldapHost: '%env(LDAP_HOST)%'
            $ldapPort: '%env(int:LDAP_PORT)%'
            $bindDn: '%env(LDAP_BIND_DN)%'
            $bindPassword: '%env(LDAP_BIND_PASSWORD)%'
            $baseDn: '%env(LDAP_BASE_DN)%'

    # --- ActiveDirectory: Repository binding ---
    App\ActiveDirectory\Domain\Repository\OrganizationRepositoryInterface:
        class: App\ActiveDirectory\Infrastructure\Ldap\AdOrganizationRepository
